services:
  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      APP_PORT: ${APP_PORT:?APP_PORT is required}
      PROD_APP_PORT: ${PROD_APP_PORT:?PROD_APP_PORT is required}
      MARIADB_HOST: ${MARIADB_HOST:?MARIADB_HOST is required}
      MARIADB_PORT: ${MARIADB_PORT:?MARIADB_PORT is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE is required}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER is required}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_API_PORT: ${MINIO_API_PORT:?MINIO_API_PORT is required}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_IMAGES: ${MINIO_BUCKET_IMAGES:?MINIO_BUCKET_IMAGES is required}
    ports:
      - "${APP_PORT:?APP_PORT is required}:${APP_PORT:?APP_PORT is required}"

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE is required}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER is required}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
    ports:
      - "${MARIADB_PORT:?MARIADB_PORT is required}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_PORT:?MINIO_API_PORT is required}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
      MINIO_API_PORT: ${MINIO_API_PORT:?MINIO_API_PORT is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_IMAGES: ${MINIO_BUCKET_IMAGES:?MINIO_BUCKET_IMAGES is required}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local "http://$${MINIO_ENDPOINT}:$${MINIO_API_PORT}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET_IMAGES}"
    restart: "no"

volumes:
  mariadb-data:
  minio-data:
